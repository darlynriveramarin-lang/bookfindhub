<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <link rel="stylesheet" href="biblioteca.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="sign up.css">
    <link rel="icon" href="descarga.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <title>Crear cuenta | BookFind Hub</title>
</head>
<body>

    <header class="encabezado">
        <div class="logo-contenedor">
            <img src="descarga.png" class="logo" alt="logo de la empresa">
            <h3>BookFind Hub</h3>
        </div>
        <nav class="contenedor-enlaces">
            <a class="enlaces" href="biblioteca_virtual.html">Discover</a>
            <a class="enlaces" href="#">Categorias</a>
            <a class="enlaces" href="#">2Categoria</a>
        </nav>
        <div class="boton-login">
            <a class="texto-login" href="registro.html"><i class="fa-solid fa-right-to-bracket"></i>Login</a>
        </div>
    </header>

    
    <main class="login-main">
        <section class="login-card">

            <div class="login-icono">
                <i class="fa-solid fa-user-plus"></i>
            </div>

            <h1>Crear cuenta</h1>
            <p class="login-subtitulo">Únete y organiza tu biblioteca personal</p>

            <form class="login-form" action="#" method="post">

             
                <div class="fila-doble">
                    <div>
                        <label class="campo-etiqueta" for="nombre">Nombre</label>
                        <div class="campo">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="nombre" name="nombre" placeholder="Ana" autocomplete="given-name" required>
                        </div>
                    </div>
                    <div>
                        <label class="campo-etiqueta" for="apellido">Apellido</label>
                        <div class="campo">
                           <i class="fa-solid fa-user"></i>
                            <input type="text" id="apellido" name="apellido" placeholder="Martínez" autocomplete="family-name" required>
                        </div>
                    </div>
                </div>

               
                <label class="campo-etiqueta" for="correo">Correo electrónico</label>
                <div class="campo">
                  <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
                </div>

                
                <label class="campo-etiqueta" for="genero">Género favorito</label>
                <div class="campo">
                    <i class="fa-solid fa-book"></i>
                    <select id="genero" name="genero" required>
                        <option value="" disabled selected>Elige una categoría</option>
                        <option value="ficcion">Ficción</option>
                        <option value="no-ficcion">No ficción</option>
                        <option value="poesia">Poesía</option>
                        <option value="educacion">Educación</option>
                        <option value="fotografia">Fotografía</option>
                        <option value="autoayuda">Autoayuda</option>
                        <option value="sci-fi">Sci-Fi</option>
                        <option value="historia">Historia</option>
                    </select>
                </div>

              
                <label class="campo-etiqueta" for="clave">Contraseña</label>
                <div class="campo">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="clave" name="clave" placeholder="Mínimo 8 caracteres" minlength="8" autocomplete="new-password" required>
                </div>
                <small class="ayuda">Usa al menos 8 caracteres.</small>

              
                <label class="campo-etiqueta" for="clave2">Confirmar contraseña</label>
                <div class="campo">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="clave2" name="clave2" placeholder="Repite tu contraseña" minlength="8" autocomplete="new-password" required>
                </div>

                
                <label class="recordar terminos">
                    <input type="checkbox" name="terminos" required>
                    <span>Acepto los <a href="#">términos y condiciones</a></span>
                </label>

                <button class="btn-login" type="submit">
                    <i class="fa-solid fa-user-plus"></i> Crear cuenta
                </button>
            </form>

            <p class="login-registro">
                ¿Ya tienes cuenta? <a href="registro.html">Inicia sesión</a>
            </p>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 BookFind Hub</p>
    </footer>

</body>
</html>
