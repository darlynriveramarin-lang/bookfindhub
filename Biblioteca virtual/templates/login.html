<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | BookFind Hub</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='biblioteca.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='descarga.png') }}">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Encabezado -->
    <header class="encabezado">

        <a href="{{url_for('inicio')}}">
            <div class="logo-contenedor">
            <img
                src="{{ url_for('static', filename='descarga.png') }}"
                class="logo"
                alt="Logo de BookFind Hub"
            >

            <h3>BookFind Hub</h3>
        </div>
        </a>
        

        <nav class="contenedor-enlaces">
            <a class="enlaces" href="{{ url_for('inicio') }}">Discover</a>
            <a class="enlaces" href="{{ url_for('inicio') }}#catalog">Categorías</a>
            <a class="enlaces" href="{{ url_for('inicio') }}#catalog">Colecciones</a>
        </nav>

         <div class="boton-login">
         <a class="texto-login" href="{{ url_for('registro') }}">
        <i class="fa-solid fa-user-plus"></i>
            Sign Up
        </a>
        </div>

    </header>

    <!-- Contenido del login -->
    <main class="login-main">

        <section class="login-card">

            <div class="login-icono">
                <i class="fa-solid fa-book-open-reader"></i>
            </div>

            <h1>Iniciar sesión</h1>

            {% if mensaje %}
                <p class="mensaje-error" role="alert">
                    {{ mensaje }}
                </p>
            {% endif %}

            <p class="login-subtitulo">
                Entra a tu biblioteca privada
            </p>

            <form
                class="login-form"
                action="{{ url_for('login') }}"
                method="POST"
            >

                <label class="campo-etiqueta" for="correo">
                    Correo electrónico
                </label>

                <div class="campo">
                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="tucorreo@ejemplo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <label class="campo-etiqueta" for="clave">
                    Contraseña
                </label>

                <div class="campo">
                    <i class="fa-solid fa-user-lock"></i>

                    <input
                        type="password"
                        id="clave"
                        name="clave"
                        placeholder="Tu contraseña"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="login-opciones">

                    <label class="recordar">
                        <input type="checkbox" name="recordar">
                        Recordarme
                    </label>

                    <a class="link-olvide" href="#">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>

                <button class="btn-login" type="submit">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Entrar
                </button>

            </form>

            <p class="login-registro">
                ¿No tienes cuenta?
                <a href="{{ url_for('registro') }}">Regístrate</a>
            </p>

        </section>

    </main>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 BookFind Hub</p>
    </footer>

</body>
</html>
