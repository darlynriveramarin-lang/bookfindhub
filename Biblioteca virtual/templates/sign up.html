<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | BookFind Hub</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='biblioteca.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='sign up.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='descarga.png') }}">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Encabezado -->
    <header class="encabezado">

         <a href="{{url_for('inicio')}}">
            <div class="logo-contenedor">
            <img
                src="{{ url_for('static', filename='descarga.png') }}"
                class="logo"
                alt="Logo de BookFind Hub"
            >

            <h3>BookFind Hub</h3>
        </div>
        </a>
        <nav class="contenedor-enlaces">
            <a class="enlaces" href="{{ url_for('inicio') }}">Discover</a>
            <a class="enlaces" href="{{ url_for('inicio') }}#catalog">Categorías</a>
            <a class="enlaces" href="{{ url_for('inicio') }}#catalog">Colecciones</a>
        </nav>

        <div class="boton-login">
            <a class="texto-login" href="{{ url_for('login') }}">
                <i class="fa-solid fa-right-to-bracket"></i>
                Login
            </a>
        </div>

    </header>

    <!-- Formulario de registro -->
    <main class="login-main">

        <section class="login-card">

            <div class="login-icono">
                <i class="fa-solid fa-user-plus"></i>
            </div>

            <h1>Crear cuenta</h1>

            {% if mensaje %}
                <p class="{{ 'mensaje-exito' if ok else 'mensaje-error' }}" role="alert">
                    {{ mensaje }}
                </p>
            {% endif %}

            <p class="login-subtitulo">
                Únete y organiza tu biblioteca personal
            </p>

            <form
                class="login-form"
                action="{{ url_for('registro') }}"
                method="POST"
            >

                <label class="campo-etiqueta" for="correo">
                    Correo electrónico
                </label>

                <div class="campo">
                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="tucorreo@ejemplo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <label class="campo-etiqueta" for="clave">
                    Contraseña
                </label>

                <div class="campo">
                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="clave"
                        name="clave"
                        placeholder="Mínimo 8 caracteres"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <small class="ayuda">
                    Usa al menos 8 caracteres.
                </small>

                <label class="campo-etiqueta" for="clave2">
                    Confirmar contraseña
                </label>

                <div class="campo">
                    <i class="fa-solid fa-key"></i>

                    <input
                        type="password"
                        id="clave2"
                        name="clave2"
                        placeholder="Repite tu contraseña"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <label class="recordar terminos">
                    <input type="checkbox" name="terminos" required>
                    <span>
                        Acepto los <a href="#">términos y condiciones</a>
                    </span>
                </label>

                <button class="btn-login" type="submit">
                    <i class="fa-solid fa-user-plus"></i>
                    Crear cuenta
                </button>

            </form>

            <p class="login-registro">
                ¿Ya tienes cuenta?
                <a href="{{ url_for('login') }}">Inicia sesión</a>
            </p>

        </section>

    </main>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 BookFind Hub</p>
    </footer>

</body>
</html>
